# Supabase project config
# See https://supabase.com/docs/guides/functions/function-configuration

# Discord OAuth callback - must be public (Discord redirects here without a JWT)
[functions.auth-discord-callback]
verify_jwt = false

# Admin API - uses custom JWT (we verify in code), not Supabase JWT
[functions.admin-api]
verify_jwt = false

# Public resource pack endpoints (Minecraft/server consumers)
[functions.resourcepacks-api]
verify_jwt = false

# Admin CV export email endpoint - uses custom admin JWT
[functions.admin-cv-email]
verify_jwt = false

# VUAG / Yahoo Finance proxy for Life Dashboard investments
[functions.market-vuag]
verify_jwt = false

# Ei neural TTS — uses custom admin JWT
[functions.ei-speak]
verify_jwt = false
